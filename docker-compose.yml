services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    volumes:
      # Mapeia apenas os arquivos de código fonte, não a pasta inteira
      - ./src:/app/src
      - ./public:/app/public
      - ./package.json:/app/package.json
      - ./vite.config.js:/app/vite.config.js
      # Volume nomeado para node_modules (evita conflitos)
      - frontend_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_BASE_URL=http://localhost:10000

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "10000:10000"
    volumes:
      # Mapeia o diretório do servidor inteiro para refletir todas as alterações de código.
      - ./server:/app
      # Volume nomeado para node_modules
      - backend_node_modules:/app/node_modules
    env_file:
      - ./server/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - NODE_ENV=development

volumes:
  frontend_node_modules:
  backend_node_modules: